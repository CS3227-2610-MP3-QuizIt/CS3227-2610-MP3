server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use the container's DNS on both Compose and hosted Docker services.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $backend "${BACKEND_SERVER_URL}";
    # Allow a 5 MiB DOCX plus multipart overhead; the API validates size.
    client_max_body_size 6m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Connection "";
        # Replace client-supplied forwarding headers at this proxy boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
