server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve again when the backend container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:7000;
    # Allow a 5 MiB DOCX plus multipart overhead; the API validates size.
    client_max_body_size 6m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # Replace client-supplied forwarding headers at this proxy boundary.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
