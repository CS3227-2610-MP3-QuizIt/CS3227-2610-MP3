[project]
name = "quiz-backend"
version = "0.1.0"
description = "Secured class quiz API with backend-only SoCLaaS integration"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.118,<1",
  "uvicorn>=0.37,<1",
  "pydantic-settings>=2.11,<3",
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "argon2-cffi>=25.1,<26",
  "defusedxml>=0.7.1,<1",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.13,<1", "mypy>=1.18,<2", "types-defusedxml>=0.7.0"]

[project.scripts]
quiz-backend = "quiz_backend.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quiz_backend"]

[tool.hatch.build.targets.sdist]
include = ["src/quiz_backend", "tests", "pyproject.toml", ".python-version", "README.md", "uv.lock"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
